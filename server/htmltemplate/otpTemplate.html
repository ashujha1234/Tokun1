<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Tokun.World OTP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
      table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
      img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
      table { border-collapse: collapse !important; }
      body { margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: #030406; }
      a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
      @media (prefers-color-scheme: dark) { .dark-bg { background-color: #0b0e13 !important; } }
      @media screen and (max-width: 600px) { .container { width: 100% !important; } .px-32 { padding-left: 16px !important; padding-right: 16px !important; } }
    </style>
  </head>
  <body style="background-color:#030406; margin:0; padding:0;">
    <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%" style="background-color:#030406;">
      <tr>
        <td align="center" class="px-32" style="padding: 32px;">
          <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" class="container" style="width:600px; max-width:600px;">

            <tr>
              <td align="center" style="padding-bottom: 28px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-radius:20px; overflow:hidden;">
                  <tr>
                    <td align="center" style="background: linear-gradient(90deg, #A300FF 0%, #6A67FF 50%, #2F86FF 100%); padding: 44px 24px; border-radius: 20px;">
                                            <div style="font-family: Inter, Arial, Helvetica, sans-serif; font-weight:600; color:#ffffff; font-size:26px; line-height:34px;">What would you like to create today?</div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

       
            <tr><td style="font-family: Inter, Arial, Helvetica, sans-serif; font-size:18px; color:#FFFFFF; padding: 4px;">Hello {{Name}},</td></tr>

           
            <tr><td style="font-family: Inter, Arial, Helvetica, sans-serif; font-size:14px; color:#C9CDD6; line-height:22px; padding: 0 4px 18px;">Here is your One Time Password (OTP).<br/>Please enter this code to verify your email address for Tokun.World</td></tr>

          
            <tr><td align="center" style="padding: 10px 0 6px;"><div style="display:inline-block; background:#15171C; border:1px solid #2A2F3A; border-radius:12px; padding:18px 28px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:34px; letter-spacing:0.32em; font-weight:700; color:#FFFFFF;">{{OTP}}</div></td></tr>

          
            <tr><td align="center" style="font-family: Inter, Arial, Helvetica, sans-serif; font-size:12px; color:#8E95A5; padding-bottom: 24px;">OTP will expire in <span style="color:#FFFFFF; font-weight:600;">5 minutes</span>.</td></tr>

        
            <tr><td style="font-family: Inter, Arial, Helvetica, sans-serif; font-size:14px; color:#C9CDD6; line-height:22px; padding: 0 4px;">Best Regards,<br/><strong style="color:#FFFFFF;">Team Tokun.World</strong></td></tr>

           
            <tr><td style="padding-top:28px;"><table role="presentation" width="100%"><tr><td style="border-top:1px solid #24262B; font-size:0; line-height:0;">&nbsp;</td></tr></table></td></tr>

          
            <tr>
              <td style="padding:0">
                {{footer}}
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
