

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOKUN - Optimize Your AI Prompts</title>
    <meta name="description" content="TOKUN helps you optimize your prompts to reduce token count while preserving meaning for AI language models." />
    <meta name="author" content="TOKUN" />

    <!-- Favicons. There were none at all, so every tab showed the browser's
         blank-page glyph and a bookmarked tokun.world was unidentifiable.

         Generated from public/icons/Tokun.png, cropped to the mark: the source
         is a 500x500 canvas the logo only fills the middle of, and scaled down
         as-is it came out a speck.

         The .ico is listed first and carries 16/32/48 in one file — it's what
         older browsers and some crawlers fetch from /favicon.ico regardless of
         these tags. The PNGs are what modern browsers actually pick. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!-- iOS home-screen tile: opaque and dark, because iOS ignores transparency
         and would otherwise composite the mark onto white. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Colours the browser UI around the page on mobile Chrome/Safari. -->
    <meta name="theme-color" content="#0B0B0D" />

    <meta property="og:title" content="TOKUN - Optimize Your AI Prompts" />
    <meta property="og:description" content="TOKUN helps you optimize your prompts to reduce token count while preserving meaning for AI language models." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://tokun.app/opengraph-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@tokun_app" />
    <meta name="twitter:image" content="https://tokun.app/opengraph-image.png" />

    <!-- The auth pages' left-hand panel.

         Its request could not start until the app bundle had downloaded and
         parsed, React had resolved /pages/Login's lazy chunk, and that chunk had
         rendered as far as the <img> — four steps deep, which is why the panel
         arrived visibly after the form it sits beside. This starts the download
         alongside the bundle instead of after it.

         Injected by path rather than written as a plain <link>: this one HTML
         file is served for every route, and none of the other pages want an
         image they will never show. -->
    <script>
      if (
        /^\/(login|signup|verify-login|verify-signup|admin-login|admin-forgot-password)\/?$/.test(
          location.pathname
        )
      ) {
        var authArt = document.createElement("link");
        authArt.rel = "preload";
        authArt.as = "image";
        authArt.href = "/icons/signup.jpg";
        authArt.setAttribute("fetchpriority", "high");
        document.head.appendChild(authArt);
      }
    </script>

    <!-- JetBrains Mono, the one family this app doesn't self-host (Inter lives
         in /Fonts/inter). Moved out of an @import in landing-page.css, where it
         could only start after that stylesheet had been fetched and parsed —
         a request chain the page waited on. The preconnects open the two
         connections in parallel with it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded WITHOUT blocking render.
         As a plain stylesheet this was the single most expensive thing on the
         page: Lighthouse measured 568 ms of render-blocking, because the
         browser will not paint until every stylesheet in <head> has been
         fetched and parsed — and this one lives on someone else's origin, so it
         costs a DNS lookup, a TLS handshake and two round-trips before the
         first pixel.
         `media="print"` makes it non-render-blocking (it does not apply to the
         screen, so nothing waits for it); the onload flips it to `all` the
         moment it arrives. The cost of the trick is a brief moment in the
         fallback font, and that is already how this family is declared —
         `--font-mono: 'JetBrains Mono', ui-monospace, …` in landing-page.css
         and PromptMarketplace.css, its only two uses. The noscript copy keeps
         it working with JavaScript off. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap"
      />
    </noscript>
  </head>

  <body>
    <div id="root"></div>

    <!-- Razorpay Checkout.
         `defer` is the whole point of this line. Without it this is a classic
         parser-blocking script: the browser stops parsing, fetches ~100 kB from
         a third-party CDN, runs it, and only THEN reaches the module below that
         actually renders the app. Nothing on first paint needs Razorpay — it is
         needed the moment someone opens checkout, which is never within the
         first second. Deferred, it downloads alongside the page and executes
         after parsing, so it no longer sits in front of first render.

         It still loads on every page, which is more than necessary. The real
         fix is on-demand loading, and half of it already exists: Subscription
         and self-dash both have an `ensureRazorpay()` that injects this script
         when they need it and no-ops if it is already there. Five other call
         sites (Header, PromptLibraryPage, PromptMarketplacePage, ChatPage,
         HirePaymentPopup) still use `window.Razorpay` directly and depend on
         this tag, so it cannot be removed until they move to a shared loader
         too. Payments are not the place to be clever in a hurry. -->
    <script defer src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
