

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOKUN - Optimize Your AI Prompts</title>
    <meta name="description" content="TOKUN helps you optimize your prompts to reduce token count while preserving meaning for AI language models." />
    <meta name="author" content="TOKUN" />

    <!-- Favicons. There were none at all, so every tab showed the browser's
         blank-page glyph and a bookmarked tokun.world was unidentifiable.

         Generated from public/icons/Tokun.png, cropped to the mark: the source
         is a 500x500 canvas the logo only fills the middle of, and scaled down
         as-is it came out a speck.

         The .ico is listed first and carries 16/32/48 in one file — it's what
         older browsers and some crawlers fetch from /favicon.ico regardless of
         these tags. The PNGs are what modern browsers actually pick. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!-- iOS home-screen tile: opaque and dark, because iOS ignores transparency
         and would otherwise composite the mark onto white. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Colours the browser UI around the page on mobile Chrome/Safari. -->
    <meta name="theme-color" content="#0B0B0D" />

    <meta property="og:title" content="TOKUN - Optimize Your AI Prompts" />
    <meta property="og:description" content="TOKUN helps you optimize your prompts to reduce token count while preserving meaning for AI language models." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://tokun.app/opengraph-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@tokun_app" />
    <meta name="twitter:image" content="https://tokun.app/opengraph-image.png" />

    <!-- The preconnects open both font connections in parallel with the
         stylesheet request that head-boot.js makes below. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Two things that must happen before the app bundle: the auth-page image
         preload, and the non-render-blocking JetBrains Mono load. Both used to
         be written inline here — an inline <script> and an `onload=` attribute
         on the fonts <link>.

         They live in an external file now because a Content-Security-Policy
         that permits either of those needs `script-src 'unsafe-inline'`, and
         that keyword gives away most of what the policy is for: with it, script
         injected into page content still runs. See public/head-boot.js for the
         full reasoning and for the comments that used to sit here. -->
    <script src="/head-boot.js"></script>

    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anybody:wght@400&family=Hanken+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      />
    </noscript>
  </head>

  <body>
    <div id="root"></div>

    <!-- Razorpay Checkout is NOT loaded here.
         It used to be, deferred, which kept it out of the render path but still
         put a third-party payment bundle on the wire for every visitor to every
         page — the landing page, a shared profile link, the marketplace. Most
         visits never reach a checkout at all.

         It is now fetched on the click that needs it. Every call site goes
         through ensureRazorpay() in src/lib/razorpayCheckout.ts, which loads it
         once, shares one in-flight request between concurrent callers, and
         retries after a failed load. Do not add this tag back: a global script
         would silently satisfy the `window.Razorpay` guard in that module and
         hide any call site that forgot to await it. -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
