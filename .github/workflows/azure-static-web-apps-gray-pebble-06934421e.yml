name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_PEBBLE_06934421E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./frontend"
          api_location: ""
          output_location: "dist"
        env:
          VITE_API_URL: https://backendtokun1-dqb8gycxhpc3c8b9.eastus-01.azurewebsites.net
          VITE_DEFAULT_MODEL: gpt-4o-mini
          # Must be the key_id whose SECRET the backend holds. An order created
          # under one Razorpay account cannot be paid from checkout opened under
          # another — Razorpay answers the preferences call with 401. This was
          # still the old key after the backend moved to the new pair.
          #
          # key_id is public (it ships to the browser), so this is not hidden for
          # secrecy — it lives in a repo secret so switching test↔live is a
          # settings change rather than a commit, and so the pair can never drift
          # apart in the way described above without someone editing Razorpay
          # config in one place. Set VITE_RAZORPAY_KEY_ID in the repo's Actions
          # secrets to the key_id matching the backend's RAZORPAY_KEY_SECRET.
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          VITE_OPENAI_API_KEY: backend-handled

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_PEBBLE_06934421E }}
          action: "close"
